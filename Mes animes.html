<h1>MES ANIMES <span>漫画</span></h1>
<nav class="tabs"><button data-a="pg:home"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg></button><button data-a="pg:disc"><svg viewBox="0 0 24 24"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"/></svg></button><button data-a="pg:lib"><svg viewBox="0 0 24 24"><path d="M4 6h2M10 6h10M4 12h2M10 12h10M4 18h2M10 18h10"/></svg></button><button data-a="pg:srch"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></button><button data-a="pg:me" id="navme"></button></nav>
<div id="app"></div>
<script>
const KEY='anime-app';
let S=null;try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
function init(){
  if(!S||typeof S!=='object')S={};
  if(!S.items){S.items=(S.animes||[]).map(a=>Object.assign({kind:'anime'},a));delete S.animes}
  if(!Array.isArray(S.tops))S.tops=[];
  S.tops.forEach(t=>{if(!t.kind)t.kind='anime'});
  S.tops=S.tops.filter(t=>!(['ga','gm','g'].includes(t.id)&&!t.ids.length));
  if(!S.hist)S.hist=[];if(!S.rank)S.rank={anime:[],manga:[]};if(!S.queue)S.queue=[];
  syncRank(true);
}
init();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let duel=null,openRank=null,rsel=null,page='home',tab='anime',filter='all',q='',sort='date',openId=null,adding=false,openTop=null,newTop=false,pick='',tmp={};
const ST={cours:'En cours',fini:'Terminé',voir:'À voir',pause:'En pause'};
const U=k=>k==='manga'?'Chapitre':'Épisode';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const byId=id=>S.items.find(a=>a.id===id);
const $=id=>document.getElementById(id);

function resize(f){return new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const w=200,h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);r(c.toDataURL('image/jpeg',.7))};im.onerror=()=>r('');im.src=fr.result};fr.readAsDataURL(f)})}
function fix(d){if(d.total&&d.ep!==''&&d.ep>=d.total){d.ep=d.total;d.status='fini'}return d}

function form(a,p,k,sh){
  a=a||{title:'',status:'voir',score:'',ep:'',total:'',genre:'',year:'',plat:''};
  const so=Object.keys(ST).map(s=>`<option value="${s}"${a.status===s?' selected':''}>${ST[s]}</option>`).join('');
  let no='<option value="">Note —</option>';
  for(let i=10;i>=1;i--)no+=`<option value="${i}"${a.score===i?' selected':''}>${i}/10</option>`;
  const nv=x=>x===''||x==null?'':x;
  return `<input id="${p}t" placeholder="Titre" value="${esc(a.title)}">
  <button data-a="fill:${p}" style="width:100%;margin-bottom:6px">Remplir automatiquement</button><div id="${p}m" class="mu" style="margin-bottom:6px"></div>
  <div class="g"><select id="${p}s">${so}</select><select id="${p}n">${no}</select></div>

function tstats(){
  const H=S.hist||[],now=new Date(),d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const days=[0,0,0,0,0,0,0],pk=[0,0,0,0],ser=new Set(),fin=new Set();let me=0;

async function fill(p){
  const t=$(p+'t').value.trim(),m=$(p+'m'),kd=tab==='manga'?'manga':'anime';
  if(!t){m.textContent='Écris d’abord le titre.';return}
  m.textContent='Recherche en cours…';
  try{
    const sm=await claude.use('sample');
    if(!sm){m.textContent='Indisponible ici.';return}
    const r=await sm.json(`Tu es une base de données de ${kd}s. Titre saisi : "${t}". Réponds UNIQUEMENT en JSON valide : {"title":"titre officiel (corrige les fautes)","year":année de première sortie (nombre),"genre":"genre principal en français (un ou deux mots)","total":nombre total d’épisodes (ou de chapitres pour un manga), ou null si inconnu ou toujours en cours,"plat":"plateformes légales en France pour le voir ou le lire, séparées par des virgules, ou chaîne vide si tu ne sais pas"}. Si tu ne reconnais pas le titre, réponds {"title":null}.`);
    if(!r||!r.title){m.textContent='Titre non reconnu.';return}
    $(p+'t').value=r.title;
    if(r.year)$(p+'y').value=r.year;
    if(r.genre)$(p+'g').value=r.genre;
    if(r.total)$(p+'o').value=r.total;
    if(r.plat)$(p+'p').value=r.plat;
    m.textContent='Rempli. Vérifie : les plateformes peuvent avoir changé.';
  }catch(x){m.textContent='Impossible pour le moment.'}
}

  else if(k==='back')openTop=null;
  else if(k==='addTop'){const id=$('pick').value;if(id&&T.ids.length<T.size)T.ids.push(id)}
  else if(k==='auto'){const have=new Set(T.ids);S.items.filter(a=>a.kind===T.kind&&!have.has(a.id)&&a.score).sort((a,b)=>b.score-a.score).forEach(a=>{if(T.ids.length<T.size)T.ids.push(a.id)})}
  else if(k==='rm')T.ids.splice(+v,1);
  else if(k==='up'&&+v>0){const i=+v;[T.ids[i-1],T.ids[i]]=[T.ids[i],T.ids[i-1]]}
  else if(k==='dn'&&+v<T.ids.length-1){const i=+v;[T.ids[i+1],T.ids[i]]=[T.ids[i],T.ids[i+1]]}
  else if(k==='delTop'){S.tops=S.tops.filter(t=>t.id!==openTop);openTop=null;init()}
  syncRank();nextDuel();save();render();
});
render();
</script></body></html>
